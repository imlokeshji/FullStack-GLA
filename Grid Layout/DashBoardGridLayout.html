<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <style>
        .container {
            display: grid;
            grid-template-columns: 1fr 3fr;
            grid-template-rows: 80px 200px 100px 70px;
            gap: 10px;

            grid-template-areas:
                "header header"
                "sidebar main"
                "sidebar cards"
                "footer footer";
        }

        .box {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 25px;
        }

        .header {
            grid-area: header;
            background: lightblue;
        }

        .sidebar {
            grid-area: sidebar;
            background: lightgreen;
        }

        .main {
            grid-area: main;
            background: lightyellow;
        }

        .cards {
            grid-area: cards;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .card1 {
            background: pink;
        }

        .card2 {
            background: pink;
        }

        .footer {
            grid-area: footer;
            background: lavender;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="box header">HEADER</div>

    <div class="box sidebar">SIDEBAR</div>

    <div class="box main">MAIN CONTENT</div>

    <div class="cards">
        <div class="box card1">CARD 1</div>
        <div class="box card2">CARD 2</div>
    </div>

    <div class="box footer">FOOTER</div>

</div>

</body>
</html>
