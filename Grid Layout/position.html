<!DOCTYPE html>
<html>
<head>
    <title>CSS Position</title>

    <style>

        body {
            height: 1500px;
        }

        .box {
            width: 150px;
            height: 100px;
            color: white;
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px;
        }


        /* 1. Static */
        .static {
            position: static;
            background: blue;
        }


        /* 2. Relative */
        .relative {
            position: relative;
            background: green;

            top: 20px;
            left: 50px;
        }


        /* Parent for absolute */
        .parent {
            width: 400px;
            height: 250px;
            background: lightgray;

            position: relative;
            margin: 20px;
        }


        /* 3. Absolute */
        .absolute {
            position: absolute;

            background: red;

            top: 20px;
            right: 20px;
        }


        /* 4. Fixed */
        .fixed {
            position: fixed;

            background: purple;

            bottom: 20px;
            right: 20px;
        }
            

    </style>

</head>


<body>

    <h1>CSS Position Example</h1>


    <!-- Static -->
    <div class="box static">
        Static
    </div>


    <!-- Relative -->
    <div class="box relative">
        Relative
    </div>


    <!-- Absolute -->
    <div class="parent">

        Parent Box

        <div class="box absolute">
            Absolute
        </div>

    </div>


    <!-- Fixed -->
    <div class="box fixed">
        Fixed
    </div>

    <div class ="box">
        box 
    </div>



</body>
</html>
