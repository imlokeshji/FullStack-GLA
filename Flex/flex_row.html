<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: flex;
            flex-direction: row;
            height: 100px;
            outline: 3px solid black;
            /* justify-content: center; */
            /* align-items: center; */
        }
        .item {

            text-align: center;
            border: 1px solid #ccc;
            background-color: bisque;
            width: 100px;
            height: 100px;
            border: 3px solid #151010;
            /* margin:100px; */
            /* flex-basis: 100px; */
        }
        #box1 {
            flex-grow: 1;
            flex-shrink: 1;
            /* flex: flex grow,flex shrink,flex basis; */
        }
        #box2 {
            flex-grow: 2;
            flex-shrink: 0.5;
        }
        #box3 {
            flex-grow: 1;
            flex-shrink: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="box1">Item 1</div>
        <div class="item" id="box2">Item 2</div>
        <div class="item" id="box3">Item 3</div>
    </div>
</body>
</html>
