<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 97vh;
            background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e');
        }
        .login-card{
            width: 300px;
            padding: 50px;
            border: 3px solid #ccc;
            border-radius: 10px;
            height: 300px;
            background: transparent;
        }
        .input-box{
            margin-bottom: 15px;
            padding: 10px;

        }
        button[type="submit"]{
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        h2{
            text-align: center;
            margin-bottom: 20px;
        }
        label{
            margin: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-card">
            <h2>Login</h2>
            <form>
                <div class="input-box">
                    <label><b>Email</b></label>
                    <input type="email" placeholder="Enter your email">
                </div>
                <div class="input-box">
                    <label><b>Password</b></label>
                    <input type="password" placeholder="Enter your password">
                </div>
                <button type="submit"><b>Login</b></button>
            </form>
        </div>
    </div>
</body>
</html>
