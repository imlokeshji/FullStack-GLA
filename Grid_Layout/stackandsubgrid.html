<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            height: 97vh;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            outline: 2px solid black;
            height: 500px;
            width: 500px;
            
        }
        .container>div {
            background-color: lightgray;
            border: 1px dashed gray;
            text-align: center;
        }

        #box1 {
            grid-column-start: 1 ;
            grid-column-end: 3;
            grid-row-start: 1;
            grid-row-end: 3;
        }

        #box6{
            grid-column-start: 2;
            grid-column-end: 3;
            grid-row-start: 1;
            grid-row-end: 2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="box1">box1</div>
        <div id="box2">box2</div>
        <div id="box3">box3</div>
        <div id="box4">box4</div>
        <div id="box5">box5</div>
        <div id="box6">box6</div>
    </div>
</body>
</html>
