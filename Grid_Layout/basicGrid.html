<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
    display: grid;
    height: 97vh;

    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr;
    grid-template-areas:
        "box1 box2 box3"
        "box1 box5 box5"
        "box4 box5 box5";
    gap: 5px;
}

.container > div {
    border: 2px solid black;
}

    #box1 {
    grid-area: box1;
    background-color: rgb(59, 40, 16);
}

#box2 {
    grid-area: box2;
    background-color: rgb(34, 132, 178);
}

#box3 {
    grid-area: box3;
    background-color: rgb(107, 124, 115);
}

#box4 {
    grid-area: box4;
    background-color: rgb(125, 96, 57);
}

#box5 {
    grid-area: box5;
    background-color: black;
}
        
    </style>
</head>
<body>
    <div class="container">
        <div id="box1">box1</div>
        <div id="box2">box2</div>
        <div id="box3">box3</div>
        <div id="box4">box4</div>
        <div id="box5">box5</div>

    </div>
</body>
</html>
