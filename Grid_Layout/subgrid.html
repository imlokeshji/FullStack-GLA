<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            outline: 2px solid black;
            height: 500px;
            width: 500px;
        }
        .parent {
            display: grid;
            background-color: rgb(25, 136, 173);
            grid-column-start: 1;
            grid-column-end: 3;
            grid-row-start: 1;
            grid-row-end: 3;
            /* grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr; */
            grid-template-columns: subgrid;
            grid-template-rows: subgrid;
        }
        .child {
            grid-column-start: 1;
            grid-column-end: 2;
            grid-row-start: 1;
            grid-row-end:2;
            background-color: rgb(223, 83, 83);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="parent">
            <div class="child">Child</div>
        </div>
    </div>
</body>
</html>
