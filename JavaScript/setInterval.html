        <script>

var counter =0;
let interval = setInterval(()=>{
        counter++;
        document.getElementById("p").innerHTML= counter+" seconds have passed";
        if(counter === 5){
            document.getElementById("p").innerHTML = "time out.....";
            clearInterval(interval);
        }
        
        },1000);



    
    </script>
