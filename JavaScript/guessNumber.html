
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Number</title>

    <style>
        .container {
            background: #fcdede;
            text-align: center;
            padding: 20px;
        }

        .result {
            background: #f48080;
            min-height: 50px;
            margin-top: 20px;
            padding: 10px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Guess the Number Between 1 and 100</h1>

        <label>Enter the number:</label>
        <input type="number" id="input">

        <button onclick="checkNumber()">Check</button>

        <div class="result" id="result">
            You have 7 chances!
        </div>

    </div>

    <script>
        var randomNumber = Math.floor(Math.random() * 100) + 1;
        var chances = 7;
        
        function checkNumber() {
            var guess = Number(document.getElementById("input").value);
            var result = document.getElementById("result");

            if (guess < 1 || guess > 100 || document.getElementById("input").value === "") {
                result.innerHTML = "Enter a number between 1 and 100!";
                return;
            }

            chances--;

            if (guess === randomNumber) {
                result.innerHTML = "Correct! You won!";
            }
            else if (chances === 0) {
                result.innerHTML = "Game Over Number was " + randomNumber;
            }
            else if (guess < randomNumber) {
                result.innerHTML = "Too Low Chances left: " + chances;
            }
            else {
                result.innerHTML = "Too High Chances left: " + chances;
            }
        }
    </script>

</body>
</html>
