<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gradient Text</title>

    <style>

        body {
            background-color: #111;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        .box {
            width: 300px;
            height: 200px;

            padding: 30px;

            border: 5px solid transparent;
            border-radius: 50px;

            background:
                linear-gradient(#111, #111) padding-box,
                radial-gradient(circle, red, blue, green) border-box;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box-text {
            font-size: 150px;
            font-weight: bold;

            background: linear-gradient(
                90deg,
                red,
                blue,
                green
            );

            background-clip: text;
            -webkit-background-clip: text;

            color: transparent;
        }

    </style>
</head>

<body>

    <div class="box">
        <span class="box-text">Box</span>
    </div>

</body>
</html>
